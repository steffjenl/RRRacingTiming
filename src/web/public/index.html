<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RRRacingTiming Live Dashboard</title>
    <style>
      :root {
        --bg-0: #f9f6ef;
        --bg-1: #f3ede0;
        --panel: #fffdf8;
        --ink: #1c1f26;
        --muted: #6a727c;
        --accent: #db5a1f;
        --accent-soft: #ffd7c4;
        --line: #e8decb;
        --ok: #147a4b;
        --warn: #955d00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Nunito", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, #ffe7d6 0%, transparent 35%),
          radial-gradient(circle at 90% 80%, #d7f3ea 0%, transparent 35%),
          linear-gradient(165deg, var(--bg-0), var(--bg-1));
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.25rem;
      }

      .hero {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 1.2rem;
        animation: rise 480ms ease-out;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 2.5rem);
        letter-spacing: 0.03em;
      }

      .subtitle {
        color: var(--muted);
        margin: 0;
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        width: fit-content;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.35rem 0.75rem;
        font-size: 0.9rem;
      }

      .status-dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 999px;
        background: var(--warn);
      }

      .status-dot.connected {
        background: var(--ok);
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 0.75rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 0.9rem;
        margin-bottom: 1rem;
        animation: rise 640ms ease-out;
      }

      .filters label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.84rem;
        color: var(--muted);
      }

      .filters input {
        width: 100%;
        border: 1px solid #d6ccba;
        border-radius: 0.65rem;
        padding: 0.55rem 0.6rem;
        font-size: 0.95rem;
        background: #fff;
        color: var(--ink);
      }

      .filters input:focus {
        outline: 2px solid var(--accent-soft);
        border-color: var(--accent);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 1rem;
        overflow: hidden;
        animation: rise 760ms ease-out;
      }

      .panel-header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.92rem;
      }

      .panel-header b {
        color: var(--accent);
      }

      .table-wrap {
        width: 100%;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 0.55rem 0.65rem;
        border-bottom: 1px solid #f1ebdf;
        white-space: nowrap;
      }

      th {
        font-size: 0.8rem;
        color: #6f6050;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: #fff8ee;
      }

      tbody tr:nth-child(odd) {
        background: #fffefb;
      }

      .driver-row {
        cursor: pointer;
      }

      .driver-row:hover {
        background: #fff3e8;
      }

      .driver-row.selected {
        background: #ffe8d8;
      }

      .coach-panel {
        margin-top: 1rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 0.95rem;
        animation: rise 880ms ease-out;
      }

      .coach-panel h2 {
        margin: 0 0 0.55rem;
        font-size: 1.2rem;
      }

      .coach-driver {
        margin: 0 0 0.65rem;
        color: var(--muted);
      }

      .coach-metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 0.45rem;
        margin-bottom: 0.65rem;
      }

      .coach-metrics div {
        background: #fff8ee;
        border: 1px solid #f0dfc2;
        border-radius: 0.65rem;
        padding: 0.45rem 0.55rem;
        font-size: 0.9rem;
      }

      .coach-metrics .score {
        background: #ffe9d7;
        border-color: #f2c8a9;
      }

      .coach-metrics .score span {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        color: #7b4f2f;
      }

      .sector-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.55rem;
        margin-bottom: 0.7rem;
      }

      .sector-chip {
        border: 1px solid #e8ddcc;
        border-radius: 0.7rem;
        padding: 0.5rem 0.6rem;
        background: #fff9f2;
        display: grid;
        gap: 0.2rem;
        font-size: 0.83rem;
      }

      .sector-chip strong {
        font-size: 0.85rem;
      }

      .sector-chip.good {
        background: #ebf8f1;
        border-color: #b9e2cd;
      }

      .sector-chip.warn {
        background: #fff7e8;
        border-color: #efd7a1;
      }

      .sector-chip.risk {
        background: #ffecea;
        border-color: #e9b8b2;
      }

      .sector-chip.neutral {
        background: #f8f6f1;
        border-color: #dfd8cb;
      }

      .coach-columns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 0.8rem;
      }

      .coach-block {
        background: #fffaf3;
        border: 1px solid #f2e5d0;
        border-radius: 0.75rem;
        padding: 0.65rem 0.8rem;
      }

      .coach-block h3 {
        margin: 0 0 0.45rem;
        font-size: 0.96rem;
      }

      .coach-block ul {
        margin: 0;
        padding-left: 1rem;
        color: #4f4a43;
      }

      .coach-block ol {
        margin: 0;
        padding-left: 1.1rem;
        color: #4f4a43;
      }

      .coach-block li {
        margin-bottom: 0.35rem;
      }

      .coach-db {
        margin-top: 0.7rem;
        padding: 0.55rem 0.7rem;
        border: 1px dashed #d9ccb4;
        border-radius: 0.7rem;
        background: #fffaf4;
      }

      .coach-db h3 {
        margin: 0 0 0.3rem;
        font-size: 0.9rem;
      }

      .coach-db p {
        margin: 0;
        color: #5b554f;
        font-size: 0.86rem;
      }

      .spark-wrap {
        margin-top: 0.45rem;
      }

      .sparkline {
        width: 100%;
        max-width: 360px;
        height: 96px;
        color: #bf5a28;
        background: #fffdf8;
        border: 1px solid #ead9c0;
        border-radius: 0.55rem;
        padding: 0.2rem;
      }

      .spark-meta {
        margin-top: 0.35rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 0.3rem;
        font-size: 0.78rem;
        color: #5c5045;
      }

      .empty {
        padding: 1.25rem;
        color: var(--muted);
      }

      .footer-note {
        margin-top: 0.85rem;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.45;
        display: grid;
        gap: 0.12rem;
        text-align: center;
        justify-items: center;
      }

      .desktop-only {
        display: block;
      }

      .mobile-only {
        display: none;
      }

      .mobile-cards {
        padding: 0.7rem;
        gap: 0.65rem;
      }

      .driver-card {
        width: 100%;
        border: 1px solid #eadbc2;
        border-radius: 0.85rem;
        background: #fff9ef;
        text-align: left;
        padding: 0.7rem;
        color: #2a2520;
      }

      .driver-card.selected {
        border-color: #df9c6f;
        background: #ffe9d7;
      }

      .driver-card-top {
        display: flex;
        justify-content: space-between;
        gap: 0.6rem;
        margin-bottom: 0.35rem;
      }

      .driver-card-team {
        color: #6b635a;
        margin-bottom: 0.45rem;
        font-size: 0.9rem;
      }

      .driver-card-metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.3rem;
        font-size: 0.82rem;
        color: #51473f;
      }

      .footer-note a {
        color: #0f6a55;
        text-decoration: none;
      }

      .footer-note a:hover {
        text-decoration: underline;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 780px) {
        .page {
          padding: 0.8rem;
        }

        .filters {
          grid-template-columns: 1fr;
        }

        .filters input {
          min-height: 44px;
          font-size: 1rem;
        }

        .desktop-only {
          display: none;
        }

        .mobile-only {
          display: grid;
        }

        .coach-columns {
          grid-template-columns: 1fr;
        }

        .coach-metrics {
          grid-template-columns: 1fr 1fr;
        }

        .status-chip {
          font-size: 0.82rem;
        }

        .sparkline {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <script>
      window.__APP_VERSION__ = "__APP_VERSION_PLACEHOLDER__";
    </script>
    <div id="root"></div>
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
